spring.application.name=Objetivos

# SQLite: o arquivo objetivos.db é criado na pasta onde a aplicação é executada
spring.datasource.url=jdbc:sqlite:objetivos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# o SQLite aceita um único escritor por vez: uma conexão evita "database is locked"
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# as listas (metas, métricas...) são LAZY e são lidas na hora de gerar o JSON
spring.jpa.open-in-view=true

# mostra a mensagem dos ResponseStatusException no JSON de erro
server.error.include-message=always
server.error.include-stacktrace=never
